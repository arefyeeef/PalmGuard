name: Build PalmGuard

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2-dev libtinfo6 libz3-dev libplist-utils wget unzip xz-utils

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          wget -q https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -O /tmp/swift-toolchain.tar.xz
          tar -xf /tmp/swift-toolchain.tar.xz -C "$THEOS/toolchain"
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O /tmp/theos-sdks.zip
          mkdir -p /tmp/theos-sdks
          unzip -q /tmp/theos-sdks.zip -d /tmp/theos-sdks
          find /tmp/theos-sdks -maxdepth 2 -type d -name '*.sdk' -exec mv {} "$THEOS/sdks/" \;

      - name: Build rootless package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: PalmGuard-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
